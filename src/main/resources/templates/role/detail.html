<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Role Detail</title>
</head>
<body>
<main>
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2>Role Detail</h2>
            <a href="/roles" class="btn btn-secondary">Back to List</a>
        </div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">Name</dt>
                <dd class="col-sm-9" th:text="${role.name}"></dd>
                
                <dt class="col-sm-3">Description</dt>
                <dd class="col-sm-9" th:text="${role.description}"></dd>
                
                <dt class="col-sm-3">Created At</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(role.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></dd>
                
                <dt class="col-sm-3">Updated At</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(role.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></dd>
            </dl>
            
            <form method="post" th:action="@{/roles/{id}/edit(id=${role.id})}">
                <button type="submit" class="btn btn-primary">Audit Log Update</button>
            </form>
            
            <hr>
            
            <h4>Assign Permissions</h4>
            <form method="post" th:action="@{/roles/{id}/assign-permissions(id=${role.id})}">
                <div class="mb-3">
                    <label class="form-label">Select Permissions</label>
                    <div class="form-check" th:each="perm : ${permissions}">
                        <input class="form-check-input" type="checkbox" name="permissionCodes" 
                               th:value="${perm.code}" id="'perm-' + ${perm.code}">
                        <label class="form-check-label" for="'perm-' + ${perm.code}" th:text="${perm.label}"></label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Assign</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
