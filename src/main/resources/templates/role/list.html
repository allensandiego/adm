<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Roles</title>
</head>
<body>
<main>
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2>Roles</h2>
            <a href="/roles/new" class="btn btn-primary" data-testid="role-new-button">New Role</a>
        </div>
        <div class="card-body">
            <form method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="search" class="form-control" th:value="${search}" placeholder="Search roles..." data-testid="role-search-input"/>
                    <button class="btn btn-outline-secondary" type="submit" data-testid="role-search-button">Search</button>
                    <a href="/roles" class="btn btn-outline-secondary" data-testid="role-clear-button">Clear</a>
                </div>
            </form>
            
            <table class="table table-striped table-hover" data-testid="role-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="role : ${roles}" data-testid="role-row">
                        <td th:text="${role.name}" data-testid="role-name-cell"></td>
                        <td th:text="${role.description}" data-testid="role-description-cell"></td>
                        <td>
                            <a th:href="@{/roles/{id}(id=${role.id})}" class="btn btn-sm btn-info" data-testid="role-view-button">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${roles.totalPages > 0}" class="d-flex justify-content-center">
                <nav>
                    <ul class="pagination" data-testid="role-pagination">
                        <li class="page-item" th:classappend="${!roles.hasPrevious} ? 'disabled'">
                            <a class="page-link" th:href="@{/roles(page=${roles.number - 1}, search=${search})}" data-testid="role-page-previous">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, roles.totalPages - 1)}" 
                            th:classappend="${i == roles.number} ? 'active'">
                            <a class="page-link" th:href="@{/roles(page=${i}, search=${search})}" th:text="${i + 1}" data-testid="role-page-number"></a>
                        </li>
                        <li class="page-item" th:classappend="${!roles.hasNext} ? 'disabled'">
                            <a class="page-link" th:href="@{/roles(page=${roles.number + 1}, search=${search})}" data-testid="role-page-next">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>
</body>
</html>
