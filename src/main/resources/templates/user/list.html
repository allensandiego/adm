<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Users</title>
</head>
<body>
<main>
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2>Users</h2>
            <a href="/users/new" class="btn btn-primary" data-testid="user-new-button">New User</a>
        </div>
        <div class="card-body">
            <form method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="search" class="form-control" th:value="${search}" placeholder="Search users..." data-testid="user-search-input"/>
                    <button class="btn btn-outline-secondary" type="submit" data-testid="user-search-button">Search</button>
                    <a href="/users" class="btn btn-outline-secondary" data-testid="user-clear-button">Clear</a>
                </div>
            </form>
            
            <table class="table table-striped table-hover" data-testid="user-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Display Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}" data-testid="user-row">
                        <td th:text="${user.username}" data-testid="user-username-cell"></td>
                        <td th:text="${user.displayName}" data-testid="user-displayname-cell"></td>
                        <td>
                            <span th:class="${user.status.name() == 'ACTIVE' ? 'badge bg-success' : 'badge bg-danger'}" 
                                  th:text="${user.status.name()}" data-testid="user-status-cell"></span>
                        </td>
                        <td>
                            <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-sm btn-info" data-testid="user-view-button">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${users.totalPages > 0}" class="d-flex justify-content-center">
                <nav>
                    <ul class="pagination" data-testid="user-pagination">
                        <li class="page-item" th:classappend="${!users.hasPrevious} ? 'disabled'">
                            <a class="page-link" th:href="@{/users(page=${users.number - 1}, search=${search})}" data-testid="user-page-previous">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}" 
                            th:classappend="${i == users.number} ? 'active'">
                            <a class="page-link" th:href="@{/users(page=${i}, search=${search})}" th:text="${i + 1}" data-testid="user-page-number"></a>
                        </li>
                        <li class="page-item" th:classappend="${!users.hasNext} ? 'disabled'">
                            <a class="page-link" th:href="@{/users(page=${users.number + 1}, search=${search})}" data-testid="user-page-next">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>
</body>
</html>
