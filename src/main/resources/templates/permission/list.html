<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Permissions</title>
</head>
<body>
<main>
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2>Permissions</h2>
            <a href="/permissions/new" class="btn btn-primary" data-testid="permission-new-button">New Permission</a>
        </div>
        <div class="card-body">
            <form method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="search" class="form-control" th:value="${search}" placeholder="Search permissions..." data-testid="permission-search-input"/>
                    <button class="btn btn-outline-secondary" type="submit" data-testid="permission-search-button">Search</button>
                    <a href="/permissions" class="btn btn-outline-secondary" data-testid="permission-clear-button">Clear</a>
                </div>
            </form>
            
            <table class="table table-striped table-hover" data-testid="permission-table">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Label</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="permission : ${permissions}" data-testid="permission-row">
                        <td th:text="${permission.code}" data-testid="permission-code-cell"></td>
                        <td th:text="${permission.label}" data-testid="permission-label-cell"></td>
                        <td>
                            <span th:class="${permission.active ? 'badge bg-success' : 'badge bg-danger'}" 
                                  th:text="${permission.active ? 'Active' : 'Inactive'}" data-testid="permission-status-cell"></span>
                        </td>
                        <td>
                            <a th:href="@{/permissions/{id}(id=${permission.id})}" class="btn btn-sm btn-info" data-testid="permission-view-button">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div th:if="${permissions.totalPages > 0}" class="d-flex justify-content-center">
                <nav>
                    <ul class="pagination" data-testid="permission-pagination">
                        <li class="page-item" th:classappend="${!permissions.hasPrevious} ? 'disabled'">
                            <a class="page-link" th:href="@{/permissions(page=${permissions.number - 1}, search=${search})}" data-testid="permission-page-previous">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, permissions.totalPages - 1)}" 
                            th:classappend="${i == permissions.number} ? 'active'">
                            <a class="page-link" th:href="@{/permissions(page=${i}, search=${search})}" th:text="${i + 1}" data-testid="permission-page-number"></a>
                        </li>
                        <li class="page-item" th:classappend="${!permissions.hasNext} ? 'disabled'">
                            <a class="page-link" th:href="@{/permissions(page=${permissions.number + 1}, search=${search})}" data-testid="permission-page-next">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>
</body>
</html>
