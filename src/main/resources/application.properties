spring.application.name=adm

# Embedded H2 datasource
spring.datasource.url=jdbc:h2:mem:adm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SQL initialization: drop existing tables, recreate the schema, then load seed data.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:drop.sql,classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=false

# Server
server.port=8080
