spring:
  application:
    name: adm
  datasource:
    url: jdbc:h2:mem:admdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  thymeleaf:
    cache: false

server:
  port: 8080

app:
  seed:
    admin-password: admin123
